<html>
    <head>
        <title>Users List</title>
    </head>
    <body>
        {% if users %}
            <ul>
                {% for user in users %}
                    <li>{{ user.id }} - {{ user.name }} - {{ user.email }} - {{ user.age }} -- <a href="{% url 'edit_user' user_id=user.id %}">Edit</a></li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No users found.</p>
        {% endif %}
    </body>
</html>
